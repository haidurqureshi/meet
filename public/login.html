<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in</title><meta name="robots" content="noindex"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head>
<body data-page="login">
<header class="top"><a class="brand" href="/" data-app>Meet</a><nav id="nav"></nav></header>
<main class="card">
<h1>Welcome back</h1>
<form novalidate>
<label>Email<input name="email" type="email" autocomplete="email" inputmode="email" required autofocus></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<div id="msg" hidden></div>
<div class="row"><button class="primary big">Log in</button><a href="/forgot">Forgot your password?</a></div>
</form>
<p class="alt">New here? <a href="/signup" data-keep-next>Create an account</a>. Joining a meeting doesn't need one.</p>
</main>
<script src="/app.js"></script>
<script src="/auth.js"></script>
</body></html>
