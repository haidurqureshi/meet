<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meeting</title><meta name="robots" content="noindex"><meta name="theme-color" content="#111214"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head>
<body data-page="room">
<svg class="visually-hidden" width="0" height="0" aria-hidden="true">
  <defs>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></symbol>
    <symbol id="i-mic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 9.3V5a3 3 0 0 0-5.7-1.3M9 9v3a3 3 0 0 0 5.1 2.1M19 10a7 7 0 0 1-1.1 3.8M5 10a7 7 0 0 0 11 5.7M12 17v4M3 3l18 18"/></symbol>
    <symbol id="i-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 10 5-3v10l-5-3"/><rect x="3" y="6" width="13" height="12" rx="2"/></symbol>
    <symbol id="i-cam-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 10 5-3v10l-5-3M10.7 6H14a2 2 0 0 1 2 2v3.3M16 16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2M3 3l18 18"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4M9 10l3-3 3 3M12 7v6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
    <symbol id="i-leave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.5c1 .3 2 .5 3 .6a2 2 0 0 1 1.5 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.3 4.2 2 2 0 0 1 4.3 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 3a2 2 0 0 1-.5 2L8 10M22 2 2 22"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="13" y="13" width="6" height="4" rx="1"/></symbol>
    <symbol id="i-gallery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
  </defs>
</svg>

<main id="notice" class="card" hidden>
  <h1 id="ntitle"></h1><p id="ntext"></p>
  <div class="row"><a class="btn" href="/" id="nhome">Home</a><button id="nretry" class="primary" hidden>Rejoin</button></div>
</main>

<main id="loading" class="card"><p class="muted">Loading the meeting…</p></main>

<section id="lobby" class="lobby" hidden>
  <div class="lobby-head">
    <p class="muted"><span id="lhost"></span></p>
    <h1 id="ltitle">Meeting</h1>
  </div>
  <div class="preview">
    <video id="lpreview" autoplay muted playsinline></video><p id="lnocam">Starting your camera…</p>
    <div class="ctl-row">
      <button id="lmic" class="ctl toggle" aria-pressed="false" title="Microphone (M)"><svg class="icon on"><use href="#i-mic"/></svg><svg class="icon off"><use href="#i-mic-off"/></svg><span class="lbl">Mute</span></button>
      <button id="lcam" class="ctl toggle" aria-pressed="false" title="Camera (V)"><svg class="icon on"><use href="#i-cam"/></svg><svg class="icon off"><use href="#i-cam-off"/></svg><span class="lbl">Stop video</span></button>
    </div>
  </div>
  <form id="lform" class="lobby-form" novalidate>
    <label for="lname">Your name</label>
    <div class="row"><input id="lname" maxlength="40" autocomplete="name" placeholder="How others will see you" required><button id="ljoin" class="primary big">Join now</button></div>
    <div id="lmsg" hidden></div>
    <p class="muted small" id="lmax">Up to 4 people. Nothing is recorded.</p>
  </form>
</section>

<section id="room" class="room" hidden>
  <div class="bar">
    <strong id="rtitle"></strong>
    <span class="meta">
      <span id="rstate" class="pill" hidden></span>
      <span id="rcount" class="pill live">1 here</span>
      <button id="rview" title="Switch view (G)" hidden><svg class="icon"><use href="#i-gallery"/></svg><span>Gallery</span></button>
      <button id="rcopy" title="Copy the meeting link" aria-label="Invite: copy the meeting link"><svg class="icon"><use href="#i-link"/></svg><span>Invite</span></button>
    </span>
  </div>
  <div class="grid" id="grid">
    <div class="stagewrap">
      <div class="stage">
        <div class="tiles n1" id="tiles"></div>
        <div id="wait" class="waitbox">
          <p><strong>You're the only one here.</strong> Share this link to invite people:</p>
          <div class="row nogap"><input id="wurl" readonly aria-label="Meeting link"><button id="wcopy">Copy</button></div>
        </div>
      </div>
      <div class="controls" role="toolbar" aria-label="Call controls">
        <button id="cmic" class="ctl toggle" aria-pressed="false" title="Microphone (M)"><svg class="icon on"><use href="#i-mic"/></svg><svg class="icon off"><use href="#i-mic-off"/></svg><span class="lbl">Mute</span></button>
        <button id="ccam" class="ctl toggle" aria-pressed="false" title="Camera (V)"><svg class="icon on"><use href="#i-cam"/></svg><svg class="icon off"><use href="#i-cam-off"/></svg><span class="lbl">Stop video</span></button>
        <button id="cshare" class="ctl share" aria-pressed="false" title="Share your screen"><svg class="icon"><use href="#i-share"/></svg><span class="lbl">Share</span></button>
        <button id="cchat" class="ctl chatbtn" aria-pressed="false" title="Chat"><svg class="icon"><use href="#i-chat"/></svg><span class="lbl">Chat</span><span id="cbadge" class="badge" hidden></span></button>
        <button id="cleave" class="ctl leave" title="Leave the meeting"><svg class="icon"><use href="#i-leave"/></svg><span class="lbl">Leave</span></button>
      </div>
    </div>
    <aside class="chat" id="chat" hidden aria-label="Chat">
      <div class="chat-head"><strong>Chat</strong><button id="cclose" aria-label="Close chat">Close</button></div>
      <ul id="clog" aria-live="polite"><li class="empty-chat" id="cempty">Messages are only seen by people in the call, and aren't saved.</li></ul>
      <form id="cform"><input id="cinput" maxlength="500" placeholder="Message everyone" autocomplete="off" aria-label="Message"><button class="primary">Send</button></form>
    </aside>
  </div>
</section>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
<script src="/room.js"></script>
</body></html>
